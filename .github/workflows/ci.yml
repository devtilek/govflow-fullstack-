name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: govflow_test
          POSTGRES_USER: govflow
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govflow -d govflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'jdbc:postgresql://localhost:5432/govflow_test' || 'jdbc:h2:mem:govflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1' }}
          TEST_DATABASE_USER: ${{ matrix.database == 'postgres' && 'govflow' || 'sa' }}
          TEST_DATABASE_PASSWORD: ${{ matrix.database == 'postgres' && 'test-password' || '' }}
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.database }}
          path: backend/target/surefire-reports/
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
